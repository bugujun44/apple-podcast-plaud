[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-podcast-plaud"
version = "0.1.0a0"
description = "Apple Podcasts → Plaud → text. Detect a downloaded episode, auto-upload to Plaud, wait for transcription, hand back to any agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jumpin" }]
requires-python = ">=3.10"
keywords = [
    "apple-podcasts",
    "plaud",
    "transcription",
    "podcast",
    "claude-code",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/jumpin-dev/apple-podcast-plaud"
Repository = "https://github.com/jumpin-dev/apple-podcast-plaud"
Issues = "https://github.com/jumpin-dev/apple-podcast-plaud/issues"

[project.scripts]
apb = "apple_podcast_plaud.bridge.cli:main"
apple-podcast-plaud = "apple_podcast_plaud.bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apple_podcast_plaud*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
